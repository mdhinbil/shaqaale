name: shaqaale
description: Shaqaale — HR & payroll, offline-first, bilingual EN/SO.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # On-device storage. The whole app must work with no network; cloud sync is
  # layered on later over Firebase REST, exactly like the other MareegTech apps.
  shared_preferences: ^2.2.3
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
