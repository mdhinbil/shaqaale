name: shaqaale
description: Shaqaale — HR & payroll, offline-first, bilingual EN/SO.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # On-device storage. The whole app must work with no network; cloud sync is
  # layered on later over Firebase REST, exactly like the other MareegTech apps.
  shared_preferences: ^2.2.3
  http: ^1.2.1
  # Profile photos (camera or gallery). Stored compressed + base64 on the
  # employee record so they sync with everything else.
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Shaqaale launcher icon — the 3-people HR badge. Generated in CI after
# `flutter create` regenerates android/.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_fg.png"
