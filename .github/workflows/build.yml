name: Build Shaqaale APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Only lib/ + pubspec.yaml + assets are committed. The android/ project is
      # generated here so there are no hand-written Gradle files to drift.
      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.mareegtech --project-name shaqaale .
          git checkout -- test/ 2>/dev/null || true

      # Plugins want compileSdk 36; flutter create writes 34. compileSdk only
      # controls which APIs can be compiled against — minSdk/targetSdk untouched.
      - name: Raise compileSdk
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle 2>/dev/null || true
          grep -rn "compileSdk" android/app/build.gradle* || true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Rename artifact
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-debug.apk out/Shaqaale-debug.apk
          ls -lh out/

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: shaqaale-apk
          path: out/Shaqaale-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Publish to GitHub Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Shaqaale build ${{ github.run_number }}
          body: |
            Shaqaale — HR & payroll (offline, EN/SO). Debug APK.
          files: out/Shaqaale-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: false
